[project]
name = "omnichannel-realestate-agent"
version = "0.1.0"
description = "Integration service for a Ringg AI real-estate sales voice agent: brochure on WhatsApp, details by email, site visits, post-call CRM sync."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = ["pytest>=8"]
evals = [
    "anthropic>=2.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
